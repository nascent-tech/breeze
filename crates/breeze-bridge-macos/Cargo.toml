[package]
name = "breeze-bridge-macos"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
breeze-domain = { path = "../breeze-domain" }
breeze-ports = { path = "../breeze-ports" }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
tempfile = "3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventSource", "CGEventTypes", "CGWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }