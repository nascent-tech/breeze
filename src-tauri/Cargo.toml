[package]
name = "breeze-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "breeze_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
breeze-domain = { path = "../crates/breeze-domain" }
breeze-app = { path = "../crates/breeze-app" }
breeze-ports = { path = "../crates/breeze-ports" }
breeze-bridge-null = { path = "../crates/breeze-bridge-null" }
breeze-bridge-common = { path = "../crates/breeze-bridge-common" }

[target.'cfg(target_os = "macos")'.dependencies]
breeze-bridge-macos = { path = "../crates/breeze-bridge-macos" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSResponder", "NSWindow"] }
