<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
    <title>Préavis</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/screens.css">
  </head>
  <body class="surface-transparent">
    <section class="glass-banner banner" role="status" aria-live="polite">
      <span class="stack row-grow">
        <span class="type-h2">Pause dans <span class="num" id="countdown">0:47</span></span>
        <span class="type-caption tone-muted" id="mode" data-simple="Mode Simple · la pause voile les applications bloquées" data-hardcore="Mode Hardcore · la pause couvre chaque écran">Mode Simple</span>
      </span>
      <button class="btn btn-secondary" id="postpone" type="button">Reporter 5 min</button>
    </section>
    <p class="type-caption tone-faint banner-reason" id="postpone-reason" data-offered="Une fois par préavis · 5 min sur le budget de 15" data-phase="Le report ne vaut que pendant le préavis" data-quota="Ce mode n’offre plus de report ce cycle" data-budget="Le budget ne couvre pas 5 min de plus">Une fois par préavis · 5 min sur le budget de 15</p>
    <script type="module" src="./scripts/notice.js"></script>
  </body>
</html>
