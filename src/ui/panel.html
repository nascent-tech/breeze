<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:">
    <title>Breeze</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/screens.css">
  </head>
  <body class="surface-transparent">
    <main class="glass-panel panel panel-shell">
      <header class="row">
        <span class="panel-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M20.2 3.8C11.5 4 5.6 8.9 4.3 15.4c-.5 2.6.9 5 3.2 5 8.8 0 12.9-8 12.7-16.6Z"></path></svg>
        </span>
        <span class="row-grow stack">
          <span class="type-h2" id="phase-title" data-work="Travail en cours" data-notice="Pause dans un instant" data-break="Pause en cours" data-return="Retour au travail" data-inactive="Cycle inactif">Travail en cours</span>
          <span class="type-caption tone-faint" id="phase-ordinal" data-pattern="Cycle {n} de la journée">Cycle 1 de la journée</span>
        </span>
        <span class="chip chip-accent" id="severity-chip">Simple</span>
      </header>

      <section class="ring" aria-live="polite">
        <svg width="128" height="128" viewBox="0 0 128 128" aria-hidden="true">
          <circle cx="64" cy="64" r="54" fill="none" stroke="var(--color-surface-dim)" stroke-width="8"></circle>
          <circle id="ring" cx="64" cy="64" r="54" fill="none" stroke="var(--color-primary-vivid)" stroke-width="8"
                  stroke-linecap="round" stroke-dasharray="0 339.3" transform="rotate(-90 64 64)"></circle>
        </svg>
        <span class="ring-text">
          <span class="type-display num" id="countdown">50:00</span>
          <span class="type-overline tone-faint" id="deadline" data-work="PAUSE À {time}" data-notice="PAUSE À {time}" data-break="SE TERMINE À {time}" data-return="PAUSE À {time}" data-inactive="AUCUNE PAUSE PRÉVUE">PAUSE À 14:00</span>
        </span>
      </section>

      <button class="btn btn-primary block" id="primary-lever" type="button"
              data-work="Faire une pause maintenant" data-notice="Faire une pause maintenant"
              data-break="Terminer la pause" data-return="Faire une pause maintenant"
              data-inactive="Faire une pause maintenant">Faire une pause maintenant</button>

      <div class="stack">
        <button class="list-row" id="postpone" type="button">
          <span class="type-h3 row-grow">Reporter 5 min</span>
          <span class="type-caption tone-faint text-end" id="postpone-reason"
                data-offered="Une fois par préavis · 5 min sur le budget"
                data-phase="Seulement pendant le préavis"
                data-quota="Ce mode n’offre plus de report ce cycle"
                data-budget="Le budget ne couvre pas 5 min de plus">Seulement pendant le préavis</span>
        </button>
        <div class="divider"></div>
        <button class="list-row" id="suspend" type="button">
          <span class="type-h3 row-grow">Suspendre</span>
          <span class="type-caption tone-faint text-end">15 min · 1 h · demain 6 h</span>
        </button>
        <div class="divider"></div>
        <button class="list-row" id="restart" type="button">
          <span class="type-h3 row-grow">Redémarrer le cycle</span>
          <span class="type-caption tone-faint text-end" id="restart-reason"
                data-offered="Reprend une phase de travail entière"
                data-break="Une pause en cours ne se redémarre pas">Reprend une phase de travail entière</span>
        </button>
      </div>

      <div class="row">
        <span class="type-h3 row-grow">Sévérité</span>
        <span class="seg" role="group" aria-label="Sévérité">
          <button class="seg-item" type="button" data-severity="simple" aria-pressed="true">Simple</button>
          <button class="seg-item" type="button" data-severity="hardcore" aria-pressed="false">Hardcore</button>
        </span>
      </div>

      <section class="card stack-sm">
        <div class="row">
          <span class="type-caption row-grow">Aujourd’hui</span>
          <span class="type-caption tone-muted" id="served">0 pause servie</span>
        </div>
        <div class="row">
          <span class="type-caption row-grow">Budget de report</span>
          <span class="type-caption tone-muted num" id="budget">15 / 15 min</span>
        </div>
        <div class="gauge"><div class="gauge-fill" id="budget-gauge"></div></div>
      </section>

      <footer class="row">
        <button class="btn btn-ghost row-grow text-start" id="open-settings" type="button">Réglages…</button>
        <button class="btn btn-ghost" id="quit" type="button">Quitter Breeze</button>
      </footer>
    </main>
    <script type="module" src="./scripts/panel.js"></script>
  </body>
</html>
