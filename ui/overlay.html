<!doctype html>
<html lang="fr" data-kind="veil">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breeze — pause</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        display: grid;
        place-items: center;
        color: var(--ink);
      }
      /* Voile : laisse deviner, ne laisse pas lire. La fenêtre Tauri est transparente. */
      html[data-kind="veil"] body {
        background: rgba(251, 252, 254, 0.84);
      }
      /* Hardcore : fond opaque, identique sur tous les écrans (§8.5). */
      html[data-kind="hardcore"] body {
        background: var(--ink);
        color: #fbfcfe;
      }
      #card {
        position: relative;
        width: 360px;
        border-radius: 28px;
        padding: 36px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      html[data-kind="hardcore"] #card {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: none;
      }
      #phase-subtitle {
        margin-top: -8px;
        display: none;
      }
      .ring-wrap {
        position: relative;
        display: grid;
        place-items: center;
      }
      .ring-center {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      #countdown {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .muted {
        color: var(--ink-3);
      }
      html[data-kind="hardcore"] .muted {
        color: rgba(251, 252, 254, 0.72);
      }
      /* Piste de l'anneau : sombre sur clair en Voile, claire translucide en
         Hardcore (sinon invisible sur fond --ink). */
      #ring-track {
        stroke: rgba(28, 33, 48, 0.08);
      }
      html[data-kind="hardcore"] #ring-track {
        stroke: rgba(255, 255, 255, 0.18);
      }
      #resume-at,
      #suggestion {
        display: none;
        text-align: center;
      }
      /* Le geste de sortie n'existe qu'en Mode Hardcore (§8.5). */
      #hint {
        display: none;
      }
      html[data-kind="veil"] #hint {
        display: block;
      }
      html[data-phase="Returning"] #hint {
        display: none;
      }
      #exit {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      html[data-kind="hardcore"] #exit {
        display: flex;
      }
      html[data-kind="hardcore"][data-phase="Returning"] #exit {
        display: none;
      }
      html[data-kind="hardcore"] .t-title {
        color: #fbfcfe;
      }
      .hold-track {
        width: 200px;
        height: 4px;
        border-radius: 3px;
        background: rgba(251, 252, 254, 0.14);
        overflow: hidden;
      }
      #hold-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: #fbfcfe;
        transition: width 0.08s linear;
      }
      #confirm {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: rgba(28, 33, 48, 0.92);
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      html[data-confirm="open"] #confirm {
        display: flex;
      }
      .confirm-row {
        display: flex;
        gap: 10px;
      }
      #confirm .btn {
        height: 40px;
        padding: 0 20px;
        border-radius: 12px;
        font: inherit;
        font-weight: 600;
        border: 0;
        cursor: default;
      }
      #confirm .btn-cancel {
        background: #fbfcfe;
        color: var(--ink);
      }
      #confirm .btn-cancel:hover {
        background: #edeff3;
      }
      /* Voile d'une fenêtre bloquée (Mode Simple nominal) : le voile remplit la fenêtre
         qu'il couvre, la carte se resserre sur le décompte. Ni anneau, ni suggestion,
         ni geste : la sortie Échap n'existe qu'en Hardcore (§8.5). */
      html[data-kind="window"],
      html[data-kind="window"] body {
        background: transparent;
      }
      html[data-kind="window"] body {
        background: rgba(251, 252, 254, 0.86);
        border-radius: 12px;
        overflow: hidden;
        padding: 12px;
        box-sizing: border-box;
      }
      html[data-kind="window"] #card {
        width: auto;
        max-width: 280px;
        padding: 20px 28px;
        border-radius: 22px;
        gap: 6px;
      }
      html[data-kind="window"] .ring-wrap svg {
        display: none;
      }
      html[data-kind="window"] .ring-center {
        position: static;
      }
      html[data-kind="window"] #countdown {
        font-size: 44px;
      }
      html[data-kind="window"] #ring-sub,
      html[data-kind="window"] #suggestion,
      html[data-kind="window"] #exit,
      html[data-kind="window"] #confirm {
        display: none;
      }
      html[data-kind="window"] #hint {
        display: block;
        text-align: center;
      }
      html[data-kind="window"][data-phase="Returning"] #hint {
        display: none;
      }
      /* Petite fenêtre : le décompte seul, sans carte. */
      @media (max-width: 320px), (max-height: 200px) {
        html[data-kind="window"] body {
          padding: 4px;
        }
        html[data-kind="window"] #card {
          background: none;
          border: 0;
          box-shadow: none;
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
          padding: 0;
        }
        html[data-kind="window"] #phase-title,
        html[data-kind="window"] #phase-subtitle,
        html[data-kind="window"] #resume-at,
        html[data-kind="window"] #hint {
          display: none !important;
        }
        html[data-kind="window"] #countdown {
          font-size: clamp(18px, 14vmin, 36px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0s !important;
          animation-duration: 0s !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="card" class="glass">
      <span class="t-title" id="phase-title">Pause en cours</span>
      <span class="t-body-lg muted" id="phase-subtitle"></span>
      <div class="ring-wrap">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle id="ring-track" cx="110" cy="110" r="96" fill="none" stroke-width="10"></circle>
          <circle
            id="ring-arc"
            cx="110"
            cy="110"
            r="96"
            fill="none"
            stroke="#16B37E"
            stroke-width="10"
            stroke-linecap="round"
            stroke-dasharray="0 603.2"
            transform="rotate(-90 110 110)"
          ></circle>
        </svg>
        <div class="ring-center">
          <span class="num" id="countdown" aria-hidden="true">—:—</span>
          <span class="t-micro muted" id="ring-sub">TIENS BON</span>
        </div>
      </div>
      <span class="t-caption muted" id="resume-at"></span>
      <span class="t-body muted" id="suggestion"></span>
      <span class="t-caption muted" id="hint">Rien à faire. Regarde ailleurs.</span>
      <div id="exit">
        <span class="t-caption muted" id="legend">Maintiens Échap pour sortir</span>
        <div class="hold-track"><div id="hold-fill"></div></div>
      </div>
      <div id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
        <span class="t-title" id="confirm-title">Terminer la pause&nbsp;?</span>
        <span class="t-caption muted" id="confirm-desc">La pause sera comptée interrompue. Les minutes non prises s’ajouteront aux prochaines pauses.</span>
        <div class="confirm-row">
          <button type="button" class="btn btn-cancel" id="confirm-cancel">Annuler</button>
          <button type="button" class="btn btn-danger" id="confirm-ok">Terminer</button>
        </div>
      </div>
      <span class="sr-only" id="sr-remaining" aria-live="polite"></span>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
