<!doctype html>
<html lang="fr" data-kind="veil">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breeze — pause</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      body {
        display: grid;
        place-items: center;
        color: var(--ink);
      }
      /* Voile : laisse deviner, ne laisse pas lire. La fenêtre Tauri est transparente. */
      html[data-kind="veil"] body {
        background: rgba(251, 252, 254, 0.84);
      }
      /* Hardcore : fond opaque, identique sur tous les écrans (§8.5). */
      html[data-kind="hardcore"] body {
        background: var(--ink);
        color: #fbfcfe;
      }
      #card {
        position: relative;
        width: 360px;
        border-radius: 28px;
        padding: 36px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      html[data-kind="hardcore"] #card {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: none;
      }
      .ring-wrap {
        position: relative;
        display: grid;
        place-items: center;
      }
      .ring-center {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      #countdown {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .muted {
        color: var(--ink-3);
      }
      html[data-kind="hardcore"] .muted {
        color: rgba(251, 252, 254, 0.6);
      }
      /* Le geste de sortie n'existe qu'en Mode Hardcore (§8.5). */
      #hint {
        display: none;
      }
      html[data-kind="veil"] #hint {
        display: block;
      }
      #exit {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      html[data-kind="hardcore"] #exit {
        display: flex;
      }
      .hold-track {
        width: 200px;
        height: 4px;
        border-radius: 3px;
        background: rgba(251, 252, 254, 0.14);
        overflow: hidden;
      }
      #hold-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: #fbfcfe;
        transition: width 0.08s linear;
      }
      #confirm {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: rgba(28, 33, 48, 0.92);
        justify-content: center;
        padding: 24px;
      }
      html[data-confirm="open"] #confirm {
        display: flex;
      }
      .confirm-row {
        display: flex;
        gap: 10px;
      }
      .btn {
        border: none;
        border-radius: 12px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-cancel {
        background: #fbfcfe;
        color: var(--ink);
      }
      .btn-confirm {
        background: rgba(251, 252, 254, 0.12);
        color: #fbfcfe;
      }
    </style>
  </head>
  <body>
    <div id="card" class="glass">
      <span class="t-title" id="phase-title">Pause en cours</span>
      <div class="ring-wrap">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="96" fill="none" stroke="rgba(28,33,48,.08)" stroke-width="10"></circle>
          <circle
            id="ring-arc"
            cx="110"
            cy="110"
            r="96"
            fill="none"
            stroke="#16B37E"
            stroke-width="10"
            stroke-linecap="round"
            stroke-dasharray="0 603.2"
            transform="rotate(-90 110 110)"
          ></circle>
        </svg>
        <div class="ring-center">
          <span class="num" id="countdown">—:—</span>
          <span class="t-micro muted" id="ring-sub">TIENS BON</span>
        </div>
      </div>
      <span class="t-caption muted" id="hint">Rien à faire. Regarde ailleurs.</span>
      <div id="exit">
        <span class="t-caption muted" id="legend">Maintiens Échap pour sortir</span>
        <div class="hold-track"><div id="hold-fill"></div></div>
      </div>
      <div id="confirm">
        <span class="t-title" style="color: #fbfcfe">Terminer la pause ?</span>
        <span class="t-caption muted">Elle sera comptée interrompue.</span>
        <div class="confirm-row">
          <button class="btn btn-cancel" id="confirm-cancel">Annuler</button>
          <button class="btn btn-confirm" id="confirm-ok">Terminer</button>
        </div>
      </div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
