<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breeze</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      #desktop {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #panel {
        position: absolute;
        top: 38px;
        left: 12px;
        right: 12px;
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .leaf-badge {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        flex: none;
        transition: background 0.4s ease;
      }
      .ring-wrap {
        display: grid;
        place-items: center;
        padding: 2px 0;
      }
      .ring-center {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
      }
      #countdown {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .levers {
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 14px;
        padding: 2px;
      }
      .stat-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 14px;
        padding: 12px 14px;
      }
      .footer {
        display: flex;
        align-items: center;
        padding: 0 2px;
      }
      .muted {
        color: var(--ink-3);
      }
      .chev {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="desktop" class="mesh">
      <div class="menubar" style="justify-content: flex-end">
        <span class="num" id="menubar-clock" style="font-size: 12.5px">—</span>
      </div>

      <div id="panel" class="glass">
        <!-- header -->
        <div style="display: flex; align-items: center; gap: 10px">
          <div class="leaf-badge" id="leaf-badge" style="background: var(--primary-tint)">
            <svg width="17" height="17" viewBox="0 0 24 24">
              <path
                id="leaf-path"
                fill="#0A6FDB"
                d="M20.2 3.8C11.5 4 5.6 8.9 4.3 15.4c-.5 2.6.9 5 3.2 5 8.8 0 12.9-8 12.7-16.6Z"
              ></path>
            </svg>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column">
            <span class="t-title" id="phase-title">Travail en cours</span>
            <span class="t-caption muted" id="phase-sub">Cycle de la journée</span>
          </div>
          <span class="chip chip-neutral" id="severity-chip">Simple</span>
        </div>

        <!-- ring -->
        <div class="ring-wrap" style="position: relative">
          <svg width="128" height="128" viewBox="0 0 128 128">
            <circle cx="64" cy="64" r="54" fill="rgba(255,255,255,.65)"></circle>
            <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(28,33,48,.08)" stroke-width="8"></circle>
            <circle
              id="ring-arc"
              cx="64"
              cy="64"
              r="54"
              fill="none"
              stroke="#1B9DF5"
              stroke-width="8"
              stroke-linecap="round"
              stroke-dasharray="0 339.3"
              transform="rotate(-90 64 64)"
            ></circle>
          </svg>
          <div class="ring-center">
            <span class="num" id="countdown">—:—</span>
            <span class="t-micro muted" id="ring-sub">PAUSE À —</span>
          </div>
        </div>

        <!-- levers (no negotiation: no report, no restart, no immediate-pause) -->
        <div class="levers" id="levers">
          <div class="rowitem" style="gap: 8px">
            <span class="t-label" style="flex: 1">Suspendre</span>
            <span class="seg">
              <span class="seg-item" data-suspend="15">15&nbsp;min</span>
              <span class="seg-item" data-suspend="60">1&nbsp;h</span>
              <span class="seg-item" data-suspend="dawn">demain 6&nbsp;h</span>
            </span>
          </div>
        </div>
        <div class="levers" id="resume-box" style="display: none">
          <div class="rowitem">
            <span class="t-label" style="flex: 1">Suspendu</span>
            <span class="seg"><span class="seg-item on" id="resume-btn">Reprendre</span></span>
          </div>
        </div>

        <!-- severity -->
        <div id="severity-row" style="display: flex; align-items: center; gap: 10px">
          <span class="t-label" style="flex: 1">Sévérité</span>
          <span class="seg" id="severity-seg">
            <span class="seg-item on" data-sev="Simple">Simple</span>
            <span class="seg-item" data-sev="Hardcore">Hardcore</span>
          </span>
        </div>

        <!-- rhythm (applies at the next cycle — §10.3 règle du sens) -->
        <div id="rhythm-row" style="display: flex; align-items: center; gap: 10px">
          <span class="t-label" style="flex: 1">Rythme</span>
          <span class="seg" id="rhythm-seg">
            <span class="seg-item" data-work="25" data-pause="5">25/5</span>
            <span class="seg-item on" data-work="50" data-pause="10">50/10</span>
            <span class="seg-item" data-work="90" data-pause="15">90/15</span>
          </span>
        </div>

        <!-- today -->
        <div class="stat-box">
          <div style="display: flex; align-items: center">
            <span class="t-caption" style="flex: 1; color: var(--ink)">Aujourd’hui</span>
            <span class="t-caption" id="today-line">0 pause servie</span>
          </div>
        </div>

        <div class="footer">
          <span class="t-caption" style="flex: 1; color: var(--ink)">Réglages…</span>
          <span class="t-caption" id="quit">Quitter Breeze</span>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
