<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breeze</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }

      [hidden] {
        display: none !important;
      }

      #panel {
        box-sizing: border-box;
        width: 100vw;
        border-radius: 16px;
        background: rgba(251, 252, 254, 0.74);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }

      #header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .leaf-badge {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        flex: none;
        transition: background 0.3s ease, opacity 0.3s ease;
      }

      .header-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .header-text > span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ring-wrap {
        position: relative;
        display: grid;
        place-items: center;
        padding: 4px 0;
      }

      .ring-wrap svg {
        transition: opacity 0.3s ease;
      }

      .ring-wrap.frozen svg,
      .ring-wrap.inactive svg {
        opacity: 0.55;
      }

      .ring-center {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      #ring-sub {
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      #countdown {
        font-size: 34px;
        line-height: 38px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      /* Au-delà d'une heure (h:mm:ss), le décompte doit tenir dans l'anneau. */
      #countdown.long {
        font-size: 26px;
        line-height: 32px;
      }

      /* Le rythme perso n'est pas cliquable ici (il se règle dans les réglages) mais
         reste lisible comme option choisie, sauf pendant le verrouillage. */
      #rhythm-custom:disabled:not(.locked) {
        opacity: 1;
      }

      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: rgba(255, 255, 255, 0.55);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        border-radius: 12px;
        padding: 12px;
      }

      .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 28px;
      }

      .control-row > .t-label {
        flex: none;
      }

      .seg-fill {
        display: flex;
      }

      .seg-fill > .seg-item {
        flex: 1;
      }

      .seg-item {
        white-space: nowrap;
      }

      .note {
        margin: 0;
      }

      .muted {
        color: var(--ink-3);
      }

      .grow {
        flex: 1;
        min-width: 0;
      }

      .link-btn {
        background: none;
        border: 0;
        padding: 4px 0;
        margin: 0;
        font-family: inherit;
        color: var(--primary);
        font-weight: 600;
        border-radius: 4px;
      }

      .link-btn:hover {
        color: var(--primary-deep);
      }

      .link-btn.danger {
        color: var(--danger);
      }

      .link-btn.danger:hover {
        color: #ae2239;
      }

      .stat-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .stat-row .label {
        flex: 1;
        color: var(--ink);
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 4px;
      }

      .quit-confirm {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--danger-tint);
        border-radius: 12px;
        padding: 12px;
      }

      .quit-confirm p {
        margin: 0;
      }

      .confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      #rhythm-seg {
        flex-wrap: wrap;
        justify-content: flex-end;
        row-gap: 4px;
      }
    </style>
  </head>
  <body>
    <div id="panel" class="glass-soft">
      <div id="header" data-tauri-drag-region>
        <div class="leaf-badge" id="leaf-badge" data-tauri-drag-region>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path
              id="leaf-path"
              fill="#0A6FDB"
              d="M20.2 3.8C11.5 4 5.6 8.9 4.3 15.4c-.5 2.6.9 5 3.2 5 8.8 0 12.9-8 12.7-16.6Z"
            ></path>
          </svg>
        </div>
        <div class="header-text" data-tauri-drag-region>
          <span class="t-title" id="phase-title">Breeze</span>
          <span class="t-caption muted" id="phase-sub">—</span>
        </div>
      </div>

      <p id="live-region" class="sr-only" aria-live="polite"></p>

      <div class="ring-wrap" id="ring-wrap" aria-hidden="true">
        <svg width="136" height="136" viewBox="0 0 128 128">
          <circle cx="64" cy="64" r="54" fill="rgba(255,255,255,.65)"></circle>
          <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(28,33,48,.08)" stroke-width="7"></circle>
          <circle
            id="ring-arc"
            cx="64"
            cy="64"
            r="54"
            fill="none"
            stroke="#1B9DF5"
            stroke-width="7"
            stroke-linecap="round"
            stroke-dasharray="0 339.3"
            transform="rotate(-90 64 64)"
          ></circle>
        </svg>
        <div class="ring-center">
          <span class="num" id="countdown">—:—</span>
          <span class="t-micro muted" id="ring-sub">—</span>
        </div>
      </div>

      <div class="group" id="levers">
        <div class="control-row">
          <span class="t-label" id="suspend-label">Suspendre</span>
          <div class="seg" id="suspend-seg" role="group" aria-labelledby="suspend-label">
            <button class="seg-item" type="button" data-suspend="15" aria-label="Suspendre 15 minutes">15&nbsp;min</button>
            <button class="seg-item" type="button" data-suspend="60" aria-label="Suspendre 1 heure">1&nbsp;h</button>
            <button class="seg-item" type="button" data-suspend="dawn" aria-label="Suspendre jusqu’à demain 6 heures">Demain 6&nbsp;h</button>
          </div>
        </div>
      </div>

      <div class="group" id="resume-box" hidden>
        <div class="control-row">
          <span class="t-caption" id="resume-label">Tu peux reprendre à tout moment.</span>
          <button class="btn btn-primary btn-sm" id="resume-btn" type="button">Reprendre</button>
        </div>
      </div>

      <div class="group">
        <div class="control-row" id="severity-row">
          <span class="t-label">Sévérité</span>
          <div class="seg" id="severity-seg" role="radiogroup" aria-label="Sévérité">
            <button class="seg-item" type="button" role="radio" data-sev="Simple">Simple</button>
            <button class="seg-item" type="button" role="radio" data-sev="Hardcore">Hardcore</button>
          </div>
        </div>
        <p class="t-caption muted note" id="severity-note" hidden></p>
        <div class="divider"></div>
        <div class="control-row" id="rhythm-row">
          <span class="t-label">Rythme</span>
          <div class="seg" id="rhythm-seg" role="radiogroup" aria-label="Rythme">
            <button class="seg-item" type="button" role="radio" data-work="25" data-pause="5">25/5</button>
            <button class="seg-item" type="button" role="radio" data-work="50" data-pause="10">50/10</button>
            <button class="seg-item" type="button" role="radio" data-work="90" data-pause="15">90/15</button>
            <button class="seg-item" type="button" role="radio" id="rhythm-custom" disabled hidden></button>
          </div>
        </div>
        <div class="control-row">
          <p class="t-caption muted note grow" id="rhythm-note" hidden></p>
          <button class="t-caption link-btn" id="adjust-rhythm" type="button">Ajuster le rythme…</button>
        </div>
      </div>

      <div class="group">
        <div class="stat-row">
          <span class="t-label label">Aujourd’hui</span>
          <span class="t-caption num" id="today-line">0 pause servie</span>
        </div>
        <p class="t-caption muted note" id="debt-line" hidden></p>
      </div>

      <div class="footer" id="footer">
        <button class="t-caption link-btn" id="open-settings" type="button">Réglages…</button>
        <button class="t-caption link-btn danger" id="quit-btn" type="button">Quitter Breeze</button>
      </div>

      <div class="quit-confirm" id="quit-confirm" role="alertdialog" aria-labelledby="quit-confirm-text" hidden>
        <p class="t-caption" id="quit-confirm-text">Quitter maintenant compte la pause comme interrompue.</p>
        <div class="confirm-actions">
          <button class="btn btn-secondary btn-sm" id="quit-cancel" type="button">Annuler</button>
          <button class="btn btn-danger btn-sm" id="quit-confirm-btn" type="button">Quitter</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="app.js"></script>
  </body>
</html>
